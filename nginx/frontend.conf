# Sirve la SPA de React y reenvía las peticiones /api al API Gateway del backend
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos con caché prolongada
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy inverso hacia el API Gateway del backend (irtra-api-gateway en la red Docker)
    location /api/ {
        proxy_pass https://irtra-api-gateway:443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Origin "http://localhost";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA: cualquier otra ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

