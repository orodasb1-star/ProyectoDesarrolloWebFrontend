services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irtra-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - irtra_net

networks:
  irtra_net:
    external: true
    name: ${BACKEND_NETWORK:-proyectoirtrabackend_irtra_net}
